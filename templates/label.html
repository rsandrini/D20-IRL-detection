<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Label Training Data</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #eee; display: flex; height: 100vh; overflow: hidden; }

        #canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            position: relative;
        }

        canvas { cursor: crosshair; display: block; }

        #sidebar {
            width: 200px;
            background: #2a2a2a;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        h2 { font-size: 16px; color: #aaa; }
        .progress { font-size: 13px; color: #888; }

        .box-slot {
            background: #333;
            border-radius: 8px;
            padding: 10px 12px;
            border: 2px solid transparent;
            font-size: 13px;
        }
        .box-slot.active { border-color: #4af; }
        .box-slot.done { border-color: #4c4; }
        .box-slot .hint { font-size: 12px; color: #888; margin-top: 4px; }

        .box-size-row {
            background: #333;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .box-size-row label { font-size: 12px; color: #aaa; white-space: nowrap; }
        .box-size-row input[type=number] {
            width: 64px;
            background: #444;
            border: 1px solid #555;
            color: #eee;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .btn {
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
        }
        .btn-save { background: #4c4; color: #000; }
        .btn-save:disabled { background: #444; color: #888; cursor: default; }
        .btn-skip { background: #c44; color: #fff; }
        .btn-clear { background: #555; color: #eee; font-size: 12px; padding: 6px; }

        #status { font-size: 12px; color: #888; text-align: center; }
        #done-msg { text-align: center; padding: 40px; }
        #done-msg h1 { color: #4c4; margin-bottom: 16px; }
        #done-msg a { color: #4af; }

        /* Floating number picker popup */
        #num-popup {
            position: fixed;
            display: none;
            background: #222;
            border: 2px solid #4af;
            border-radius: 10px;
            padding: 10px;
            z-index: 100;
            box-shadow: 0 4px 24px rgba(0,0,0,0.7);
        }
        #num-popup.die2 { border-color: #fa4; }
        #num-popup .popup-title {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
            text-align: center;
        }
        #num-popup .num-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }
        #num-popup .num-btn {
            background: #444;
            border: none;
            color: #eee;
            padding: 8px 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: 40px;
        }
        #num-popup .num-btn:hover { background: #4af; color: #000; }
        #num-popup.die2 .num-btn:hover { background: #fa4; color: #000; }

        /* Confirm popup after both dice labeled */
        #confirm-popup {
            position: fixed;
            display: none;
            background: #222;
            border: 2px solid #4c4;
            border-radius: 10px;
            padding: 12px 14px;
            z-index: 101;
            box-shadow: 0 4px 24px rgba(0,0,0,0.7);
            text-align: center;
            min-width: 160px;
        }
        #confirm-popup .confirm-title {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 10px;
        }
        #confirm-popup .confirm-dice {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #eee;
        }
        #confirm-popup .confirm-btns {
            display: flex;
            gap: 8px;
        }
        #confirm-popup .btn-confirm-save {
            flex: 1;
            padding: 8px;
            background: #4c4;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        #confirm-popup .btn-confirm-clear {
            flex: 1;
            padding: 8px;
            background: #555;
            color: #eee;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>

{% if not filename %}
<div id="done-msg">
    <h1>All images labeled!</h1>
    <p>Run the training pipeline to retrain the model.</p>
    <p><a href="/">Back to roll page</a></p>
</div>
{% else %}

<div id="canvas-area">
    <canvas id="canvas"></canvas>
</div>

<!-- Confirm popup after both dice labeled -->
<div id="confirm-popup">
    <div class="confirm-title">Confirm labels</div>
    <div class="confirm-dice" id="confirm-dice"></div>
    <div class="confirm-btns">
        <button class="btn-confirm-save" onclick="save()">Save & Next</button>
        <button class="btn-confirm-clear" onclick="clearBoxes()">Clear</button>
    </div>
</div>

<!-- Floating number picker, appears near click -->
<div id="num-popup">
    <div class="popup-title" id="popup-title">Die 1 — select face</div>
    <div class="num-grid" id="popup-nums"></div>
</div>

<div id="sidebar">
    <div style="font-size:13px; margin-bottom:10px;">
        <a href="/" style="color:#aaa; text-decoration:none; margin-right:10px;">← Roll</a>
        <a href="/routes" style="color:#aaa; text-decoration:none;">API Docs</a>
    </div>
    <div>
        <h2>Label Image</h2>
        <div class="progress">{{ remaining }} left of {{ total }}</div>
    </div>

    <div class="box-size-row">
        <label>Box px</label>
        <input type="number" id="box-size" min="20" max="600" value="{{ box_size }}"
               oninput="redraw();">
    </div>

    <div class="box-slot active" id="slot-1">
        <strong>Die 1</strong>
        <div class="hint" id="hint-1">Click on die 1</div>
    </div>

    <div class="box-slot" id="slot-2">
        <strong>Die 2 <span style="font-weight:normal;color:#888;font-size:11px">(optional)</span></strong>
        <div class="hint" id="hint-2">Click on die 2</div>
    </div>

    <button class="btn btn-clear" onclick="clearBoxes()">Clear</button>
    <button class="btn btn-save" id="btn-save" disabled onclick="save()">Save & Next</button>
    <button class="btn btn-skip" onclick="skip()">Skip</button>
    <div id="status"></div>
</div>

<script>
const FILENAME = "{{ filename }}";
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const img = new Image();
img.src = '/to_label/' + FILENAME;

let scale = 1;
let imgW = 0, imgH = 0;
let boxes = [null, null];
let currentSlot = 0;

const sizeInput = document.getElementById('box-size');
function getBoxHalf() { return Math.round(parseInt(sizeInput.value) / 2 / scale); }

img.onload = () => {
    const area = document.getElementById('canvas-area');
    scale = Math.min((area.clientWidth - 20) / img.width, (area.clientHeight - 20) / img.height, 1);
    canvas.width  = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    imgW = img.width;
    imgH = img.height;
    redraw();
};

// --- Popup picker ---
const popup = document.getElementById('num-popup');
const popupNums = document.getElementById('popup-nums');
const popupTitle = document.getElementById('popup-title');
const confirmPopup = document.getElementById('confirm-popup');

let lastClickX = 0, lastClickY = 0;

function showConfirm() {
    const d1 = boxes[0] ? boxes[0].label : null;
    const d2 = boxes[1] ? boxes[1].label : null;
    document.getElementById('confirm-dice').textContent =
        d2 ? `Die 1: ${d1}   Die 2: ${d2}` : `Die 1: ${d1}`;

    confirmPopup.style.display = 'block';

    const pw = confirmPopup.offsetWidth  || 170;
    const ph = confirmPopup.offsetHeight || 110;
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    let left = lastClickX + 16;
    let top  = lastClickY - ph / 2;
    if (left + pw > vw - 8) left = lastClickX - pw - 16;
    if (top < 8) top = 8;
    if (top + ph > vh - 8) top = vh - ph - 8;

    confirmPopup.style.left = left + 'px';
    confirmPopup.style.top  = top  + 'px';
}

function hideConfirm() {
    confirmPopup.style.display = 'none';
}

function buildPopup() {
    popupNums.innerHTML = '';
    for (let n = 1; n <= 20; n++) {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.textContent = n;
        btn.onclick = () => {
            selectNumber(currentSlot, n);
            hidePopup();
        };
        popupNums.appendChild(btn);
    }
}
buildPopup();

function showPopup(clientX, clientY, slotIdx) {
    popup.className = slotIdx === 1 ? 'die2' : '';
    popupTitle.textContent = (slotIdx === 0 ? 'Die 1' : 'Die 2') + ' — select face';

    popup.style.display = 'block';

    // Position near click, keeping inside viewport
    const pw = popup.offsetWidth  || 230;
    const ph = popup.offsetHeight || 180;
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    let left = clientX + 16;
    let top  = clientY - ph / 2;

    if (left + pw > vw - 8) left = clientX - pw - 16;
    if (top < 8) top = 8;
    if (top + ph > vh - 8) top = vh - ph - 8;

    popup.style.left = left + 'px';
    popup.style.top  = top  + 'px';
}

function hidePopup() {
    popup.style.display = 'none';
}

// Close popup when clicking outside
document.addEventListener('click', e => {
    if (popup.style.display === 'block' && !popup.contains(e.target) && e.target !== canvas) {
        hidePopup();
    }
}, true);

// --- Box placement ---
function selectNumber(slotIdx, num) {
    if (!boxes[slotIdx]) return;
    boxes[slotIdx].label = num;

    document.getElementById('slot-' + (slotIdx + 1)).classList.add('done');
    document.getElementById('hint-' + (slotIdx + 1)).textContent = 'Face: ' + num + ' ✓';

    if (slotIdx === 0 && !boxes[1]) {
        currentSlot = 1;
        document.getElementById('slot-1').classList.remove('active');
        document.getElementById('slot-2').classList.add('active');
    } else if (slotIdx === 1) {
        // Both dice labeled — show confirm
        currentSlot = 2;
        showConfirm();
    }

    updateSaveButton();
    redraw();
}

function updateSaveButton() {
    document.getElementById('btn-save').disabled = !(boxes[0] && boxes[0].label);
}

// Show box preview on hover
canvas.addEventListener('mousemove', e => {
    if (popup.style.display === 'block') return;
    if (currentSlot > 1) return;
    const r = canvas.getBoundingClientRect();
    const cx = e.clientX - r.left;
    const cy = e.clientY - r.top;
    const half = parseInt(sizeInput.value) / 2;
    redraw();
    ctx.strokeStyle = currentSlot === 0 ? 'rgba(68,170,255,0.6)' : 'rgba(255,170,68,0.6)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(cx - half, cy - half, half * 2, half * 2);
    ctx.setLineDash([]);
});

canvas.addEventListener('mouseleave', redraw);

// Single click — place box then open popup
canvas.addEventListener('click', e => {
    if (currentSlot > 1) return;
    lastClickX = e.clientX;
    lastClickY = e.clientY;

    const r = canvas.getBoundingClientRect();
    const cx = (e.clientX - r.left) / scale;
    const cy = (e.clientY - r.top) / scale;
    const half = getBoxHalf();

    const x1 = Math.max(0, Math.round(cx - half));
    const y1 = Math.max(0, Math.round(cy - half));
    const x2 = Math.min(imgW, Math.round(cx + half));
    const y2 = Math.min(imgH, Math.round(cy + half));

    boxes[currentSlot] = { x1, y1, x2, y2, label: null };
    document.getElementById('hint-' + (currentSlot + 1)).textContent = 'Select the face number';
    document.getElementById('slot-' + (currentSlot + 1)).classList.remove('done');
    updateSaveButton();
    redraw();

    showPopup(e.clientX, e.clientY, currentSlot);
});

function redraw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    const colors = ['#4af', '#fa4'];
    boxes.forEach((box, i) => {
        if (!box) return;
        ctx.strokeStyle = colors[i];
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
        ctx.strokeRect(box.x1 * scale, box.y1 * scale,
                       (box.x2 - box.x1) * scale, (box.y2 - box.y1) * scale);
        if (box.label) {
            ctx.fillStyle = colors[i];
            ctx.font = 'bold 16px Arial';
            ctx.fillText(box.label, box.x1 * scale + 4, box.y1 * scale + 18);
        }
    });
}

function clearBoxes() {
    boxes = [null, null];
    currentSlot = 0;
    hidePopup();
    hideConfirm();
    [1, 2].forEach(s => {
        document.getElementById('slot-' + s).classList.remove('active', 'done');
        document.getElementById('hint-' + s).textContent = 'Click on die ' + s;
    });
    document.getElementById('slot-1').classList.add('active');
    updateSaveButton();
    redraw();
}

async function save() {
    document.getElementById('status').textContent = 'Saving...';
    const res = await fetch('/label/' + FILENAME, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ boxes: boxes.filter(b => b && b.label) })
    });
    window.location.href = (await res.json()).next;
}

async function skip() {
    document.getElementById('status').textContent = 'Skipping...';
    const res = await fetch('/label/' + FILENAME, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ skip: true })
    });
    window.location.href = (await res.json()).next;
}
</script>
{% endif %}
</body>
</html>
