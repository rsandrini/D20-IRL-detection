<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roll Dice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        h1 { color: #333; }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        img { max-width: 100%; height: auto; display: block; margin: 0 auto; }

        .form-container { margin-top: 20px; text-align: center; }

        .mode-selector { margin-bottom: 12px; }
        .mode-selector label { margin-right: 14px; cursor: pointer; font-size: 15px; }

        input[type="submit"], button#rollButton {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }

        input[type="submit"]:hover, button#rollButton:hover { background-color: #0056b3; }
        input[type="submit"]:disabled, button#rollButton:disabled { background-color: #6c757d; cursor: not-allowed; }

        .selected-face {
            font-size: 3em;
            font-weight: bold;
            color: #222;
        }

        .detection-list {
            color: #555;
            font-size: 0.95em;
            margin-top: 4px;
        }

        .report-section {
            margin-top: 18px;
            padding: 12px;
            background: #f8f8f8;
            border-radius: 6px;
            display: inline-block;
        }

        .report-section input[type="number"] {
            width: 60px;
            padding: 4px 6px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .report-section button {
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 5px 12px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            margin-left: 6px;
        }

        .report-section button:hover { background: #a71d2a; }

        #report-status { font-size: 13px; color: #333; margin-top: 6px; }

        .error-box {
            color: #dc3545;
            font-size: 1.1em;
            margin: 10px 0;
            padding: 8px 12px;
            background: #fff5f5;
            border-radius: 4px;
            border: 1px solid #f5c6cb;
        }

        nav { margin-bottom: 10px; font-size: 14px; }
        nav a { margin-right: 12px; color: #007bff; text-decoration: none; }
        nav a:hover { text-decoration: underline; }

        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        #login-box {
            background: #fff; padding: 32px 36px; border-radius: 8px;
            max-width: 420px; width: 90%; text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        #login-box h2 { margin: 0 0 8px; color: #333; }
        #login-box p { color: #666; font-size: 14px; margin: 0 0 16px; }
        #token-input {
            width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
            font-family: monospace; font-size: 13px; box-sizing: border-box; margin-bottom: 12px;
        }
        #token-save-btn {
            background: #007bff; color: #fff; border: none; padding: 9px 28px;
            border-radius: 4px; font-size: 15px; cursor: pointer;
        }
        #token-save-btn:hover { background: #0056b3; }
        #token-error { color: #dc3545; font-size: 13px; margin-top: 8px; min-height: 18px; }
        .user-badge {
            float: right; font-size: 13px; color: #555;
            background: #f0f0f0; padding: 3px 10px; border-radius: 12px;
        }
        .user-badge a { color: #dc3545; margin-left: 8px; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>

<!-- Login overlay — shown when no valid token in localStorage -->
<div id="login-overlay" style="display:none;">
    <div id="login-box">
        <h2>D20 IRL</h2>
        <p>Paste your token to get started.<br>Ask the admin or check <a href="/admin">/admin</a>.</p>
        <input type="text" id="token-input" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off">
        <div>
            <button id="token-save-btn" onclick="saveToken()">Save token</button>
        </div>
        <div id="token-error"></div>
    </div>
</div>

<div class="container">
    <nav>
        <a href="/">Roll</a>
        <a href="/admin">Admin</a>
        <a href="/calibrate">Calibrate</a>
        <a href="/label">Label</a>
        <a href="/routes">API Docs</a>
    </nav>

    <div id="user-badge" class="user-badge" style="display:none;">
        <span id="user-badge-name"></span>
        <a href="#" onclick="logout(); return false;">logout</a>
    </div>

    <h1>D20 Roll</h1>

    <!-- Form section -->
    <div class="form-container">
        <form id="rollForm" onsubmit="submitRoll(event)">
            <div class="mode-selector">
                <label><input type="radio" name="mode" value="normal" checked> Normal</label>
                <label><input type="radio" name="mode" value="advantage"> Advantage</label>
                <label><input type="radio" name="mode" value="disadvantage"> Disadvantage</label>
            </div>
            Show gif <input type="checkbox" name="debug" id="debug" checked>
            <br><br>
            <button type="submit" id="rollButton">Let's roll!</button>
        </form>
    </div>

    <!-- Status/loading section (hidden by default) -->
    <div id="queue-status" style="display:none; text-align:center; margin-top:20px;">
        <img src="/static/gif/loading.gif" id="loading-gif" style="display:none; margin: 0 auto;">
        <p id="queue-msg" style="font-size:1.2em; color:#555;"></p>
    </div>

    <!-- Error section (hidden by default) -->
    <div id="error-box" style="display:none;" class="error-box"></div>

    <!-- Result section (hidden by default) -->
    <div id="result-box" style="display:none; text-align:center; margin-top:20px;">
        <div id="selected-face" class="selected-face"></div>
        <div id="detection-list" class="detection-list"></div>
        <img id="result-img" style="max-width:100%; margin:10px auto; display:block;">
        <img id="roll-gif" style="max-width:100%; margin:10px auto; display:none;">
        <div id="info-container" style="margin-top:8px; font-size:13px; color:#777;"></div>
        <!-- Report section -->
        <div id="report-section" style="display:none;" class="report-section">
            <span style="font-size:13px; color:#666;">Wrong result?</span>
            <div id="report-inputs" style="margin-top:6px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;"></div>
            <br>
            <button onclick="reportWrong()">Report</button>
            <div id="report-status"></div>
        </div>
    </div>
</div>

<script>
    // ---------------------------------------------------------------------------
    // Auth helpers
    // ---------------------------------------------------------------------------
    function getToken() {
        return localStorage.getItem('d20_token') || '';
    }

    function authHeaders() {
        return {'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json'};
    }

    function showLoginOverlay() {
        document.getElementById('login-overlay').style.display = 'flex';
        document.getElementById('rollForm').style.display = 'none';
    }

    function hideLoginOverlay() {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('rollForm').style.display = 'block';
    }

    function logout() {
        localStorage.removeItem('d20_token');
        localStorage.removeItem('d20_client_id');
        showLoginOverlay();
        document.getElementById('user-badge').style.display = 'none';
        document.getElementById('result-box').style.display = 'none';
        document.getElementById('queue-status').style.display = 'none';
    }

    function saveToken() {
        var token = document.getElementById('token-input').value.trim();
        document.getElementById('token-error').textContent = '';
        if (!token) {
            document.getElementById('token-error').textContent = 'Please enter a token.';
            return;
        }
        fetch('/api/auth/me?token=' + encodeURIComponent(token))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.id) {
                localStorage.setItem('d20_token', token);
                hideLoginOverlay();
                showUserBadge(data.id);
            } else {
                document.getElementById('token-error').textContent = 'Invalid or disabled token.';
            }
        })
        .catch(function() {
            document.getElementById('token-error').textContent = 'Could not reach server.';
        });
    }

    function showUserBadge(username) {
        document.getElementById('user-badge-name').textContent = username;
        document.getElementById('user-badge').style.display = 'inline-block';
    }

    // ---------------------------------------------------------------------------
    // Init — verify stored token on page load
    // ---------------------------------------------------------------------------
    (function init() {
        var token = getToken();
        if (!token) {
            showLoginOverlay();
            return;
        }
        fetch('/api/auth/me?token=' + encodeURIComponent(token))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.id) {
                hideLoginOverlay();
                showUserBadge(data.id);
            } else {
                localStorage.removeItem('d20_token');
                showLoginOverlay();
            }
        })
        .catch(function() {
            // Server unreachable — allow cached token to be tried on submit
            hideLoginOverlay();
        });
    })();

    // ---------------------------------------------------------------------------
    // Roll logic (same as before, with auth added)
    // ---------------------------------------------------------------------------
    var currentRollId = null;
    var showDebug = false;

    function getClientId() {
        var stored = localStorage.getItem('d20_client_id');
        if (stored) return stored;
        var id = 'client-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now();
        localStorage.setItem('d20_client_id', id);
        return id;
    }

    function submitRoll(e) {
        e.preventDefault();
        document.getElementById('error-box').style.display = 'none';
        document.getElementById('result-box').style.display = 'none';
        document.getElementById('queue-status').style.display = 'none';

        var mode = document.querySelector('input[name="mode"]:checked').value;
        showDebug = document.getElementById('debug').checked;
        var clientId = getClientId();

        document.getElementById('rollButton').disabled = true;
        document.getElementById('rollButton').textContent = 'Rolling...';

        fetch('/api/roll', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({mode: mode, debug: showDebug, client_id: clientId})
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error === 'unauthorized') { showLoginOverlay(); resetButton(); return; }
            if (data.error) { showError('Error: ' + data.error); resetButton(); return; }
            currentRollId = data.roll_id;
            listenForResult(data.roll_id, data.position);
        })
        .catch(function(err) { showError('Request failed: ' + err); resetButton(); });
    }

    function listenForResult(rollId, position) {
        if (position > 0) {
            showQueueStatus('You are #' + position + ' in queue', false);
        } else {
            showQueueStatus('Rolling...', true);
        }

        var evtSource;
        try {
            evtSource = new EventSource('/api/roll/' + rollId + '/stream?token=' + encodeURIComponent(getToken()));
            evtSource.onmessage = function(event) {
                var s = JSON.parse(event.data);
                handleStatus(s, rollId);
                if (s.status === 'done' || s.status === 'unknown') { evtSource.close(); }
            };
            evtSource.onerror = function() { evtSource.close(); pollStatus(rollId); };
        } catch(e) {
            pollStatus(rollId);
        }
    }

    function pollStatus(rollId) {
        function doPoll() {
            fetch('/api/roll/' + rollId + '/status', {headers: {'Authorization': 'Bearer ' + getToken()}})
            .then(function(r) { return r.json(); })
            .then(function(s) {
                handleStatus(s, rollId);
                if (s.status !== 'done' && s.status !== 'unknown') { setTimeout(doPoll, 1000); }
            })
            .catch(function() { setTimeout(doPoll, 2000); });
        }
        doPoll();
    }

    function handleStatus(s, rollId) {
        if (s.status === 'queued') {
            showQueueStatus('You are #' + s.position + ' in queue', false);
        } else if (s.status === 'rolling') {
            showQueueStatus('Rolling...', true);
        } else if (s.status === 'done') {
            document.getElementById('queue-status').style.display = 'none';
            if (s.http_status && s.http_status !== 200) {
                showError('Error: ' + (s.result.error || 'unknown error'));
                resetButton();
            } else {
                showResult(s.result);
                resetButton();
            }
        } else if (s.status === 'unknown') {
            showError('Roll not found or expired.');
            resetButton();
        }
    }

    function showQueueStatus(msg, isRolling) {
        var qs = document.getElementById('queue-status');
        var loadingGif = document.getElementById('loading-gif');
        qs.style.display = 'block';
        loadingGif.style.display = isRolling ? 'block' : 'none';
        document.getElementById('queue-msg').textContent = msg;
    }

    function showResult(result) {
        document.getElementById('result-box').style.display = 'block';
        var selectedFaceEl = document.getElementById('selected-face');
        var detectionListEl = document.getElementById('detection-list');
        var resultImgEl = document.getElementById('result-img');
        var rollGifEl = document.getElementById('roll-gif');
        var infoEl = document.getElementById('info-container');

        selectedFaceEl.textContent = (result.selected && result.selected.face != null) ? result.selected.face : 'No detection';

        var detText = '';
        if (result.mode === 'advantage') detText += 'Advantage — ';
        else if (result.mode === 'disadvantage') detText += 'Disadvantage — ';
        if (result.detections && result.detections.length > 0) {
            detText += result.detections.map(function(d) {
                return d.face + ' (' + (d.confidence * 100).toFixed(1) + '%)';
            }).join(', ');
        } else {
            detText += 'No dice detected';
        }
        detectionListEl.textContent = detText;

        if (result.image) { resultImgEl.src = result.image; resultImgEl.style.display = 'block'; }
        else { resultImgEl.style.display = 'none'; }

        rollGifEl.style.display = 'none';
        if (showDebug && result.gif) { rollGifEl.src = result.gif; rollGifEl.style.display = 'block'; }

        var infoText = '';
        if (result.time_elapsed_detection) infoText += 'Detection: ' + result.time_elapsed_detection + 's';
        if (result.time_elapsed) { if (infoText) infoText += ' | '; infoText += 'Total: ' + result.time_elapsed + 's'; }
        infoEl.textContent = infoText;

        populateReportSection(result.roll_id || currentRollId, result.detections || []);
    }

    function showError(msg) {
        var eb = document.getElementById('error-box');
        eb.textContent = msg;
        eb.style.display = 'block';
    }

    function resetButton() {
        var btn = document.getElementById('rollButton');
        btn.disabled = false;
        btn.textContent = "Let's roll!";
    }

    function populateReportSection(rollId, detections) {
        currentRollId = rollId;
        var reportSection = document.getElementById('report-section');
        var reportInputs = document.getElementById('report-inputs');
        document.getElementById('report-status').textContent = '';
        if (!detections || detections.length === 0) { reportSection.style.display = 'none'; return; }
        reportInputs.innerHTML = '';
        detections.forEach(function(d, i) {
            var label = document.createElement('label');
            label.style.fontSize = '13px';
            label.textContent = 'Die ' + (i + 1) + ' ';
            var input = document.createElement('input');
            input.type = 'number'; input.className = 'correct-face-input';
            input.min = 1; input.max = 20; input.value = d.face; input.style.width = '60px';
            label.appendChild(input);
            reportInputs.appendChild(label);
        });
        reportSection.style.display = 'inline-block';
    }

    function reportWrong() {
        if (!currentRollId) return;
        var inputs = document.querySelectorAll('.correct-face-input');
        var faces = [];
        for (var i = 0; i < inputs.length; i++) {
            var v = parseInt(inputs[i].value);
            if (!v || v < 1 || v > 20) { document.getElementById('report-status').textContent = 'All values must be between 1 and 20.'; return; }
            faces.push(v);
        }
        fetch('/api/roll/' + currentRollId + '/report', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({correct_faces: faces})
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            document.getElementById('report-status').textContent = data.status === 'ok' ? 'Reported — thank you!' : 'Error: ' + (data.error || 'unknown');
        })
        .catch(function() { document.getElementById('report-status').textContent = 'Request failed.'; });
    }
</script>
</body>
</html>
